<title>پورتال HSE — طلای هیرد</title>
<style>
:root{--bg:#0d1117;--c1:#161b22;--c2:#1c2330;--bd:#2a3340;--tx:#e6edf3;--mu:#8b98a6;--pr:#22c55e;--pr2:#12301f;--rd:#ef4444;--am:#f59e0b}
:root[data-t=light]{--bg:#eef2f5;--c1:#fff;--c2:#f5f7f9;--bd:#d9e0e6;--tx:#1c2733;--mu:#64727f;--pr:#15803d;--pr2:#dcfce7}
*{box-sizing:border-box}body{margin:0;font-family:Vazirmatn,Tahoma,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx);font-size:14px}
.top{background:var(--c1);border-bottom:1px solid var(--bd);padding:8px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
.lg{display:flex;align-items:center;gap:10px}.lg img{height:38px;background:#fff;border-radius:6px;padding:3px}.lg b{font-size:15px}.lg small{color:var(--mu);display:block;font-size:11px;font-weight:400}
.wrap{display:grid;grid-template-columns:235px 1fr;min-height:calc(100vh - 56px)}
.side{background:var(--c1);border-left:1px solid var(--bd);padding:10px;overflow:auto;max-height:calc(100vh - 56px);position:sticky;top:56px}
.side h4{margin:12px 6px 4px;color:var(--mu);font-size:12px}.side button{display:flex;gap:8px;width:100%;text-align:right;border:0;background:none;color:var(--tx);padding:8px;border-radius:8px;cursor:pointer;font:inherit}
.side button:hover{background:var(--c2)}.side button.on{background:var(--pr2);color:var(--pr);font-weight:700}
main{padding:16px;min-width:0}.card{background:var(--c1);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:14px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}.kpi{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-bottom:14px}
.k{background:var(--c1);border:1px solid var(--bd);border-radius:14px;padding:14px;border-top:3px solid var(--bd)}.k small{color:var(--mu);display:block;font-size:12px}.k div{font-size:28px;font-weight:700;margin:4px 0}.k.g{border-top-color:var(--pr)}.k.y{border-top-color:var(--am)}.k.r{border-top-color:var(--rd)}
.hero{height:170px;border-radius:14px;background:var(--c2) center/cover;margin-bottom:14px;display:flex;align-items:flex-end;padding:14px;color:#fff;font-weight:700;font-size:17px;text-shadow:0 1px 6px #000}
.tabs{display:flex;gap:6px;margin-bottom:14px}.tabs button{border:1px solid var(--bd);background:var(--c1);color:var(--tx);padding:8px 14px;border-radius:10px;cursor:pointer;font:inherit}.tabs button.on{border-color:var(--pr);color:var(--pr)}
label{display:block;font-size:12px;color:var(--mu);margin:8px 0 3px}input,select,textarea{width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--c2);color:var(--tx);font:inherit}
.chk{display:flex;flex-wrap:wrap}.chk label{display:inline-flex;gap:5px;align-items:center;margin:3px 12px 3px 0;color:var(--tx);font-size:13px}.chk input{width:auto}
button.b{background:var(--pr);color:#fff;border:0;border-radius:8px;padding:9px 16px;cursor:pointer;font:inherit;margin-top:12px}button.s{background:var(--bd);color:var(--tx)}button.sm{padding:3px 9px;margin:0;font-size:12px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:7px;border-bottom:1px solid var(--bd);text-align:right;vertical-align:top}th{color:var(--mu);font-weight:600}.tbl{overflow-x:auto}
.tag{padding:2px 8px;border-radius:10px;font-size:11px;background:var(--pr2);color:var(--pr);white-space:nowrap}.tag.w{background:#3a2a0a;color:var(--am)}.tag.r{background:#3b1414;color:var(--rd)}
.login{max-width:360px;margin:9vh auto}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ck{display:grid;grid-template-columns:1fr 110px 150px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--bd)}
h3{margin:0 0 10px;font-size:15px}.note{color:var(--mu);font-size:12px}svg text{fill:var(--tx);font-family:inherit}
.ov{position:fixed;inset:0;background:#000a;z-index:20;overflow:auto;padding:16px}.ov>div{max-width:820px;margin:auto;background:var(--c1);border-radius:14px;padding:18px}
#mb{display:none}@media(max-width:820px){.wrap{grid-template-columns:1fr}.side{display:none;position:static;max-height:none}.side.open{display:block}#mb{display:inline-block}.ck{grid-template-columns:1fr}}
@media print{#app{display:none}.ov{position:static;background:#fff!important;color:#000}.ov>div{background:#fff!important;color:#000}.noprint{display:none}th,td{border-color:#999}}

body{background:linear-gradient(160deg,var(--bg),var(--c2))fixed}.card,.k{border-radius:18px;box-shadow:0 1px 8px #0000000d}
.mh{display:flex;align-items:center;gap:14px;margin-bottom:14px}.mh h2{margin:0;font-size:20px}.mh small{color:var(--mu)}.mh .ic{width:52px;height:52px;border-radius:14px;background:var(--pr2);display:grid;place-items:center;font-size:26px;border:1px solid var(--bd)}.mh .xb{margin-right:auto}
.tabs button{border-radius:12px}.tabs button.on{background:var(--pr2)}.up input{padding:12px;border-style:dashed}

:root[data-t=light]{--bg:#f4efe6;--c1:#fffdf9;--c2:#f1ebe0;--bd:#e0d6c3;--tx:#1d2340;--mu:#6b6a78;--pr:#243a7c;--pr2:#e6e9f6;--gd:#b8924a}
.top{background:linear-gradient(90deg,#141d45,#2c3a78)!important;color:#fff;border-bottom:3px solid #b8924a}.top .note,.top small{color:#d9dcef}
h3{color:var(--pr)}[data-t=dark] h3{color:#e6c98a}.k{border-top:3px solid #b8924a}.hero{height:230px;border:2px solid #b8924a55}
.mh{padding:22px;border-radius:18px;background:linear-gradient(90deg,#141d45ee,#141d4570),var(--ph) center/cover;color:#fff;min-height:100px;border-bottom:3px solid #b8924a}.mh small{color:#eadfc3}.mh .ic{background:#ffffff26;border-color:#ffffff55}
.fl{display:flex;align-items:center;gap:4px;overflow-x:auto;padding:10px 0}.st{min-width:104px;text-align:center}.st .ci{width:58px;height:58px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;font-size:26px;background:var(--pr2);border:2px solid #b8924a}.st b{display:block;font-size:13px}.st small{color:var(--mu);font-size:11px}.ar{color:#b8924a;font-size:20px}
.ph3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}.ph3>div{height:120px;border-radius:12px;background:center/cover;display:flex;align-items:flex-end}.ph3 span{background:#141d45cc;color:#fff;padding:3px 10px;font-size:12px;border-radius:0 10px 0 12px}
.mcs{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}.mc{border:2px solid var(--bd);border-radius:14px;padding:12px;text-align:center;cursor:pointer;background:var(--c2)}.mc.on{border-color:var(--pr);background:var(--pr2)}.mc small{display:block;color:var(--mu)}
.aib{background:var(--c2);border:1px dashed #b8924a;border-radius:12px;padding:10px;margin-bottom:10px}
button.b{background:var(--pr)}button.b:hover{background:#b8924a}
.fi{display:flex;justify-content:space-between;gap:8px;padding:8px 6px;border-bottom:1px solid var(--bd);cursor:pointer}.fi:hover{background:var(--pr2)}.fi.hl{border-right:4px solid #c0392b;background:#fdf1ef}.fi small{color:var(--mu);white-space:nowrap}</style>

/* ---------- charts (plain SVG) ---------- */
const COL=["#22c55e","#3b82f6","#f59e0b","#ef4444","#a855f7","#94a3b8"];
function cnt(arr,fn){const m={};arr.forEach(x=>{const k=fn(x);if(k!=null&&k!=="")m[k]=(m[k]||0)+1});return Object.entries(m)}
const none='<p class="note">داده‌ای ثبت نشده</p>';
function bar(d,u){if(!d.length)return none;const mx=Math.max(1,...d.map(x=>x[1])),w=66;
return`<svg viewBox="0 0 ${d.length*w+20} 175" width="100%">${d.map((x,i)=>{const h=x[1]/mx*105;return`<rect x="${i*w+12}" y="${130-h}" width="42" height="${h}" rx="4" fill="${COL[i%6]}"/><text x="${i*w+33}" y="${124-h}" text-anchor="middle" font-size="11">${x[1]}${u||""}</text><text x="${i*w+33}" y="148" text-anchor="middle" font-size="9">${esc(String(x[0]).slice(0,12))}</text><text x="${i*w+33}" y="160" text-anchor="middle" font-size="9">${esc(String(x[0]).slice(12,24))}</text>`}).join("")}</svg>`}
function donut(d){const t=d.reduce((a,x)=>a+x[1],0);if(!t)return none;let a=-Math.PI/2;const r=55,c=70;
const arcs=d.map((x,i)=>{const s=x[1]/t*2*Math.PI;if(d.length==1)return`<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${COL[0]}" stroke-width="26"/>`;
const x1=c+r*Math.cos(a),y1=c+r*Math.sin(a);a+=s;const x2=c+r*Math.cos(a),y2=c+r*Math.sin(a);return`<path d="M${x1} ${y1}A${r} ${r} 0 ${s>Math.PI?1:0} 1 ${x2} ${y2}" fill="none" stroke="${COL[i%6]}" stroke-width="26"/>`}).join("");
return`<div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><svg viewBox="0 0 140 140" width="130">${arcs}<text x="70" y="76" text-anchor="middle" font-size="20" font-weight="700">${t}</text></svg><div>${d.map((x,i)=>`<div><span style="color:${COL[i%6]}">●</span> ${esc(x[0])}: ${x[1]}</div>`).join("")}</div></div>`}
function line(d){const mx=Math.max(1,...d.map(x=>x[1])),w=62;const p=d.map((x,i)=>`${i*w+28},${118-x[1]/mx*95}`).join(" ");
return`<svg viewBox="0 0 ${d.length*w} 160" width="100%"><polyline points="${p}" fill="none" stroke="${COL[0]}" stroke-width="2.5"/>${d.map((x,i)=>`<circle cx="${i*w+28}" cy="${118-x[1]/mx*95}" r="4" fill="${COL[0]}"/><text x="${i*w+28}" y="${108-x[1]/mx*95}" text-anchor="middle" font-size="11">${x[1]}</text><text x="${i*w+28}" y="145" text-anchor="middle" font-size="9">${x[0]}</text>`).join("")}</svg>`}

س موارد ذیل واجد صلاحیت بوده و به کارگرفته شوند:", "سلامت جسمی و روانی", "مهارت های تجربی", "دانش انجام کار", "پیمانکار موظف است قبل از به کارگیری نیروهای خود، با انجام معاینات پزشکی و مصاحبه های اختصاصی از تناسب آنها با وظایف محوله در برآوردن الزامات سیستم مدیریت HSE اطمینان حاصل کند", "پیمانکار، موظف است صلاحیت کارکنان خود را برای انجام وظایفشان به طور مرتب مورد بازنگری و ارزیابی قرار دهد، این بررسی ها شامل شناسایی و بهینه نمودن عوامل و تجهیزات برای ارتقاء کیفی فعالیت های کارکنان و آموزش های مورد نیاز آنها جهت دستیا بی به این منظو ر باشد.", "اقدامات لازم برای اطمینان از صلاحیت افراد، می تواند شامل موارد ذیل باشد:", "تجزیه و تحلیل نظام مند الزامات مرتبط با وظایف.", "معاینات دور های و آموزش های HSE", "ارزیابی عملکرد افراد", "شواهد مستند شده از صلاحیت فردی.", "برنامه هایی برای ارزیابی دوره ای.", "تبصره ـ الزامات HSE در جذب و به‌کارگیری نیروی انسانی پیمانکار", "مسئولیت احراز صلاحیت و مدارک:پیمانکار مکلف است پیش از جذب و به‌کارگیری هر یک از نیروهای خود، نسبت به احراز هویت، صلاحیت شغلی، مدارک قانونی، گواهینامه‌ها و مجوزهای موردنیاز آنان اقدام نموده و در طول مدت قرارداد نیز اعتبار مدارک مذکور را کنترل نماید. به‌کارگیری اتباع خارجی صرفاً در صورت داشتن مدارک اقامت معتبر و مجوز قانونی اشتغال به کار مجاز خواهد بود.", "مسئولیت به‌کارگیری نیروی واجد شرایط:پیمانکار مسئول مستقیم انتخاب و به‌کارگیری نیروی انسانی واجد شرایط بوده و موظف است از به‌کارگیری افراد فاقد مجوز، صلاحیت، گواهینامه یا مدارک قانونی موردنیاز جلوگیری نماید. به‌طور خاص، رانندگان باید دارای گواهینامه معتبر و متناسب با نوع وسیله نقلیه و اپراتورهای ماشین‌آلات نیز باید دارای صلاحیت و مجوزهای موردنیاز باشند.", "مسئولیت ایمنی و حوادث:در صورت وقوع هرگونه حادثه، صدمه جانی، فوت، خسارت مالی یا خسارت به تجهیزات، ماشین‌آلات و تأسیسات که ناشی از به‌کارگیری فرد فاقد صلاحیت، مجوز، گواهینامه یا مدارک قانونی لازم باشد، پیمانکار در حدود مسئولیت قانونی خود، مسئول پاسخگویی و جبران کلیه خسارات و هزینه‌های مستقیم و تبعی ناشی از تخلف خواهد بود و این امر مانع از مسئولیت سایر اشخاصی که مطابق قانون مسئول شناخته می‌شوند نخواهد بود.", "مسئولیت‌های قانونی، بیمه‌ای و مالی:کلیه مسئولیت‌ها و تعهدات قانونی پیمانکار در قبال کارکنان تحت پوشش وی، از جمله حقوق و مزایا، بیمه، حوادث ناشی از کار و سایر تعهدات قانونی، در حدود قوانین و مقررات مربوط، بر عهده پیمانکار است. پیمانکار مکلف است کلیه خساراتی را که در نتیجه قصور، تخلف یا عدم رعایت الزامات این تبصره و در حدود مسئولیت قانونی وی به کارفرما وارد می‌شود، جبران نماید.", "مسئولیت ارائه و صحت مدارک:پیمانکار مسئول صحت، اعتبار و اصالت مدارک ارائه‌شده در خصوص نیروهای خود بوده و ارائه مدارک خلاف واقع یا استفاده از مدارک منقضی یا فاقد اعتبار، تخلف قراردادی محسوب می‌شود.", "اختیار کارفرما در جلوگیری از فعالیت:در صورت مشاهده یا احراز عدم احراز شرایط قانونی، حرفه‌ای یا HSE هر یک از نیروهای پیمانکار، کارفرما یا واحد HSE مجاز است از ورود یا ادامه فعالیت فرد مذکور در محدوده کارگاه جلوگیری نماید و پیمانکار مکلف است بدون وقفه نسبت به خروج و جایگزینی وی با نیروی واجد شرایط اقدام نماید.", "ضمانت اجرای تخلف:در صورت تخلف پیمانکار از مفاد این تبصره، کارفرما مجاز است علاوه بر جلوگیری از ادامه فعالیت فرد فاقد شرایط، تا سقف 2.5 درصدصورت وضعیت به ازای هر نفر و برای هر مورد تخلف از مطالبات، صورت‌وضعیت‌ها یا تضمینات پیمانکار کسر و وصول نماید. اعمال این ضمانت اجرا، مانع از مطالبه خسارات وارده و اعمال سایر حقوق قراردادی و قانونی کارفرما نخواهد بود.", "۴-4-  شرح وظایف HSE و نقش مدیریت و عوامل پیمانکار", "۴-۴-۱-  مدیر عامل / مدیریت پیمانکاری", "موظف است در صورت مشاهده موارد خاص (نظیر تکرار مداوم حوادث، بیماری های واگیردار، موارد مشکوک و…) با انجام اقدامات مناسب نسبت به مقابله با آنها اقدام نماید و با تخصیص منابع مورد نیاز (مالی، انسانی، فیزیکی و…  ) کلیه مراحل را مطابق موازین HSE تضمین نماید.", "موظف است شرایط لازم را به منظور ارائه آموزش های HSE مورد نیاز کارکنان خود فراهم نماید", "بنا به تشخیص و موافقت نماینده کارفرما، پیمانکار می تواند از امکانات آموزشی و آموزش های کارفرما نیز بهره مند گردد.", "متعهد است که مقررات HSE لازم را در رابطه با خدمات و کارهای مورد نظر رعایت کند. به علاوه ضروری است که عملیاتش را به صورتی انجام دهد که همواره مطابق با تعهدات و وظایف مندرج در قوانین بهداشت، ایمنی و محیط زیست باشد. همچنین بایستی تابع مصوبات مراجع قانونی و یا دیگر مصوباتی باشد که در رابطه با موارد بهداشتی، ایمنی و زیست محیطی ابلاغ می شوند. در این زمینه لازم است، شرح وظایف هر یک از کارکنان پیمانکار در قبال مسائل HSE را مشخص کرده و به اطلاع وی برساند.", "۴-۴-2-   مسئول HSE پیمانکار", "پس از طی دوره های آشنائی با محیط کار و آموزش های لازم، در مدت انجام کار پیمانکاری، مسؤلیت کامل کارکنان پیمانکار را از نظر آموزش و الزامات HSE برعهده خواهد داشت.", "بایستی در کلیه جلسات هماهنگی دوره ای کارفرما و پیمانکار حضور یافته وگزارش وضعیت HSE محیط کار خود را جهت اتخاذ تصمیمات مقتضی ارائه نماید.", "مسؤولیت آموزش کلیه نفرات پیمانکار را در رابطه با آموزش های لازم از قبیل رعایت مقررات HSE  در ضمن کار، برنامه های مدیریت بهداشت، روش های اطفاء حریق، جنبه های زیست محیطی، برنامه مدیریت محیط زیست و اقدامات لازم در زمان اعلام وضعیت اضطراری، به عهده خواهد داشت.", "پیروی از الزامات را متناسب با ماهیت کار و بر اساس نظام نامه مربوط به خط مشی HSE مصوب تضمین می کند. این الزامات شامل استفاده اجباری از تجهیزات حفاظت فردی (کلاه ایمنی، کفش ایمنی (پنجه فولادی)، لباس کار مناسب، دستکش و همچنین وسایل حفاظتی مناسب برای چشم و گوش) می باشد.", "روزانه رونوشت گزارش عملکرد خود را به نماینده کارفرما تحویل نماید.", "هماهنگی و همکاری لازم و تنگاتنگ با نماینده کارفرما را در صورت اعلام وضعیت اضطراری در کارگاه به عمل آورند.", "کلیه شئونات اخلاقی را هنگام برخورد و تذکرات لازم به کا رکنان پیمانکار رعایت نموده و در صورت مشاهده هرگونه شرایط یا اعمال غیر بهداشتی، نا ایمن، مخاطره آمیز برای محیط زیست و مغایر با مقررات HSE مراتب را سریعاً به نماینده کارفرما منعکس نماید.", "نمونه هایی از اتفاقاتی که حسب موضوع پیمان ، باید به نماینده کارفرما گزارش شود عبارت است از:", "– هر گونه آلودگی و تخریب زیست محیطی ناشی از فعالیت (به صورت مستقیم یا غیر مستقیم) و حتی ریزش مواد به بیرون از مرزهای محدودة فعالیت", "– آسیب زیست محیطی به ساکنان و همسایگان سایت", "– مسمومیت افراد", "– بیماری مکرر افراد", "بایستی در صورت بروز آتش سوزی و یا حوادث مهم (بهداشتی، ایمنی و محیط زیستی)، فورا نماینده کارفرما را مطلع نماید.", "بایستی در صورت وقوع هر نوع حادثه برای کارکنان پیمانکار یا حادثه ای که دارای تبعات مخاطره آمیز برای محیط زیست باشد، سریعاً نسبت به تهیه گزارش کامل حادثه و ارسال آن به HSE کارفرما و نمایندة کارفرما اقدام نماید.", "موظف می باشند تا در صورت مشاهده هرگونه اقدام نا ایمن که امکان بروز حادثه ناتوان کننده در آن بوده و یا عملیاتی که دارای مخاطرات زیست محیطی باشد و تذکرات و تمهیدات معمول درمرتفع کردن آن کارساز نباشد پس از متوقف کردن کار، بلافاصله مراتب را به نماینده کارفرما کتباً اعلام نماید.", "موظف است نسبت به گردآوری اطلاعات و آمار مرتبط با عملکرد HSE ، تکمیل پرسشنامه ها وسایر موارد درخواستی کارفرما درخصوص HSE اقدام نماید.", "۴-۴-3- کارکنان پیمانکار", "کارکنان پیمانکار موظف به رعایت کلیه مقرراتHSE  در محیط پیمانکاری (تعریف شده از سوی نمایندة کارفرما) هستند.", "شاغلین پیمانکار موظفند در صورت مشاهده رفتار و شرایط مغایر با مقررات HSE  در عملیات اجرایی، مراتب را به مسؤول HSE پیمانکار گزارش دهند.", "۴-5-  آموزش HSE رده های مختلف شغلی", "پیمانکاران موظفند کلیه پرسنل تحت امر خود را در خصوص مقرراتHSE   و همچنین مقررات و دستورالعمل های مربوطه آموزش دهند. چنانچه امکانات لازم برای این امر را نداشته باشند میتوانند با رعایت شرایط مندرج در پیمان از همکاری متخصصین کارفرما در امر آموزش استفاده نمایند، اما این امر نباید پیمانکار را از مسؤولیت در تضمین آموزش HSE کارکنان خود رها سازد. بدیهی است در صورت استفاده از دوره های آموزشی کارفرما، هزینه های مربوطه که ازطرف کارفرما اعلام می گردد به عهدة پیمانکار می باشد.", "آموزش ها باید حداقل حاوی اطلاعات ارزیابی خطرات بهداشتی، مقررات و آیین نامه های بهداشتی (فردی، محیط و صنعتی) و کمک های اولیه، اطلاعات ارزیابی خطرات محیط کار، مقررات و آیین نامه های ایمنی و نحوه آمادگی و مقابله با شرایط اضطراری، استفاده ازسیستم های آتش نشانی، نحوه استفاده از برگه اطلاعات ایمنی مواد (MSDS) و تعهدات، قوانین والزامات زیست محیطی مربوط به فعالیت ها، اثرات نامطلوب زیست محیطی پروژه و اطلاعاتی در مورد مدیریت مواد زائد، کنترل آلودگی آب، هوا و خاک باشد.", "کارکنان پیمانکار و یا هر کس دیگری که از طریق پیمانکار به کار گمارده می شوند باید آموزش های لازم را مطابق با مقررات HSE کارفرما، فراگیرند. اگر در مقررا ت HSE کارفرما استانداردی موجود نباشد مقررات پیمانکار باید به تأیید کارفرما برسد.", "پیمانکارها موظف است آموزش HSE کارکنان پیمانکاران فرعی را انجام دهد.", "پیمانکار باید مدارک و مستندات لازم در زمینه آموزش کارکنان خود را ارائه نماید. مدارک بایستی شامل نام افراد آموزش دیده، محتوای دوره، زمان اجرای دوره و اسامی مربیان باشد.", "یادآوری: مدت زمان آموزش های HSE با توجه به حجم و نوع فعالیت پیمانکار باید به تایید نماینده کارفرما برسد.", "۴-6-  راهکارها و راهبردی نمودن HSE", "پیمانکار و کارکنان ایشان (اصلی و فرعی) در حیطه فعالیت خود لازم است علاوه بر آشنایی و رعایت کلیه مقررات مربوط به وزارت بهداشت، درمان و آموزش پزشکی، وزارت کار، سازمان تامین اجتماعی، سازمان حفاظت محیط زیست، به دیگر مقررات ملی و همچنین استانداردهای ملی و بین المللی(NIOSH, OSHA, EPA, NFPA,….) آشنایی داشته و نسبت به رعایت آنها اقدام نماید.", "رعایت مقررات و مستنداتی (دستورالعمل ها، روش های اجرایی، راهنماها، فرم ها و…) که پس ازعقد قرار داد تهیه شده و از طرف کارفرما به پیمانکار ابلاغ می گردد توسط پیمانکار الزامی می باشد.", "تذکر1: کلیه فعالیت های در حال انجام در سایت به منظور اطمینان از تطابق با الزامات سیستم مدیریت HSE به صورت منظم ممیزی و بازرسی می شود.", "پیمانکار موظف به ارائه روش های انجام کار( با لحاظ کردن الزامات HSE ) به نحوی که خطری افراد، اموال و یا محیط زیست را تهدید نکند، به کارفرما می باشد.", "۴-6-۱-   برگه های اطلاعات ایمنی مواد MSDS", "پیمانکار موظف است برای تمام مواد شیمیایی مورد استفاده در فرایندهای کاری خود برگه های اطلاعات ایمنی مواد (MSDS) را به زبان فارسی و حسب نیاز به زبان انگلیسی، به تایید نماینده کارفرما برساند و در کلیه مراحل حمل", "و نقل، جا به جایی و استفاده به کار برد. این برگه باید حاوی اطلاعات زیر باشد:", "– مشخصات کلی", "–   خصوصیات فیزیکی و شیمیایی", "–  خطرات ایمنی", "–   خطرهای بهداشتی", "–   مخاطرات زیست محیطی", "–   حدود مجاز", "–  کمک های اولیه و نحوه واکنش در شرایط اضطراری", "–  شرایط ایمنی انبارش، حمل و نقل", "–   تعیین سطح خطر", "۴-6-2-  ممیزی و بازرسی HSE", "پیمانکار باید برنامه های منظم ممیزی و بازرسی HSE به منظور حصول اطمینان از لحاظ شدن الزاماتHSE  این برنامه بایستی مکتوب بوده و شامل دامنه، تناوب، مسئولیت ها، نگهداری سوابق و اقدامات اصلاحی گردد.", "علاوه بر برنامه های دوره ای ممیزی، باید بازدیدهای اتفاقی از محل انجام کار به عمل آید. بازرسی های غیر دوره ای HSE در صورت وقوع حوادث نیز انجام شود.", "بازرسی و ممیزی به صورت رسمی و غیر رسمی توسط کارفرما در هر زمان از تاسیسات ، تجهیزات و نیروی انسانی پیمانکار به عمل می آید. در صورت مشاهده موارد مغایر با HSE ، پیمانکار موظف است مورد را به سرعت برطرف و تصحیح نماید.", "پیمانکار موظف است اسناد و مدارک مورد درخواست کارفرما را در هر زمانی تهیه و ارائه نماید.", "۴-6-3-  طرح مدیریت واکنش در شرایط اضطراری در نمونه دستورالعمل HSE پیمانکاران", "پیمانکار موظف است برای تدوین یک طرح مناسب بر اساس راهنمای طرح مدیریت واکنش در شرایط اضطراری(ERP)  برای مواجهه با وضعیت های اضطراری اقدام و پس از تایید کارفرما اجرا نماید.", "تذکر: در جاهایی که کارفرما خود دارای طرح واکنش در شرایط اضطراری می باشد، پیمانکار موظف به تبعیت از آن می باشد.", "بنا به صلاحدید نماینده کارفرما، پیمانکار ملزم است در برنامه مانورهای عملیاتی (HSE) مرتبط با حوزه فعالیت خود شرکت کند.", "پیمانکار می بایست تجهیزات و نیروی کار لازم را جهت اجرای دستورالعمل های واکنش در شرایط اضطراری فراهم نماید. در این رابطه پیمانکار موظف است نسبت به آموزش های لازم وتمرینات کافی برای افراد خود اقدام نماید.", "نماینده کارفرما باید در مباحث مربوط به وضعیت های اضطراری مشارکت نماید به طوری که از تناسب دستورالعمل های پیمانکار با دستورالعمل های کارفرما اطمینان حاصل نماید.", "چنانچه وضعیت اضطراری دقیقاً در محل فعالیت پیمانکار رخ داده باشد، تا قبل از تهیه گزارش اولیه حادثه، نسبت به عملیات پاکسازی محل اقدامی به عمل نیاید و فقط با مجوز کتبی نماینده کارفرما می توانند اقدام لازم را به عمل آورند.", "پیمانکار موظف به پیگیری وضعیت درمان کارکنان مصدوم خود پس از انتقال به مراکز درمانی (در صورت نیاز) است.", "۴-6-4-  ملاحظات HSE مجوزهای کار", "نحوه انجام کار", "انجام هر نوع کاری توسط کارکنان پیمانکار (به عنوان مجری کار) اعم از کار گرم، سردو… بایستی پس از دریافت اجازه کار بر اساس دستورالعمل صدور مجوز کار (PTW) از واحد مربوطه صورت پذیرد.", "اجازه کار دریافتی بایستی دارای امضاء تیار پیمانکار باید مطابق با مقرراتHSE  باشد.", "آب آشامیدنی و مصارف بهداشتی آن باید منطبق با دستورالعمل ویژگی های آب آشامیدنی واحد  بهداشتHSE باشد.", "محیط کار پیمانکاران باید تمیز و مرتب بوده و پاکیزه و منظم نگهداری شود.به این منظور باید محلی برای ذخیره و نگهداری تجهیزات در نظر گرفته شود. دستورالعمل ضبط و ربط در همه فرایندها، اعمال، فعالیت ها و مشاغل باید رعایت شود. ضبط و ربط برای این فرایندها یک بخش جانبی نبوده بلکه بخش تکمیل کننده آنها است. به عنوان بخشی از کار، مواد زائد و زباله ها باید از منطقه فعالیت، به صورت مرتب و مستمر جمع آوری شود.", "ج- کمک های اولیه", "پیمانکار مکلف است متناسب با تعداد کارگران و نوع خطرات کارگاه جعبه کمک های اولیه مجهز به تجهیزات و داروهای لازم تهیه و در نقاطی که دسترسی فوری به آنها برای کارگران میسر باشد نصب نماید.", "لازم است متناسب با تعداد کارگران و نوع خطرات کارگاه حداقل 4 نفر از کارکنان پیمانکار آموزش کمک های اولیه را برای عکس العمل سریع در هنگام وقوع حادثه گذرانده باشند و به نماینده کارفرما معرفی گردد.", "مسئول HSE پیمانکار موظف است به محض ابتلاء یکی از کارگران به امراض واگیردار مراتب را به نماینده کارفرما گزارش دهد.", "محل استقرار خدمات پزشکی باید برای کلیه کارکنان شناخته شده باشد.", "۴-6-7-  مدیریت ایمنی و آتش نشانی در نمونه دستورالعمل HSE پیمانکاران", "پیمانکار باید نسبت به شناسایی، ارزیابی و کنترل ریسک های ایمنی انواع خطرات محیط کار خود اقدام کند. از جمله این خطرات عبارتند از:", "مکانیکی/ الکتریکی / حرارتی", "خطرات ناشی از ارتفاع", "ناشی از مواد شیمیایی و اجسام", "پیمانکاری باید برای انواع خطرات شناسایی شده، تدابیری به منظور پیشگیری از وقوع حوادث محتمل اتخاذ نماید.", "پیمانکار موظف است با توجه به خطرات موجود در محیط کار نسبت به تهیه و نصب علائم هشدار دهنده مربوط اقدام نماید.", "به منظورحصول اطمینان ازعملکردمناسب تجهیزات و ماشین آلات(از نظربهداشت، ایمنی و محیط زیست)، پیمانکارموظف است یک برنامه مدون برای زمان تعمیر و نگهداری تدوین و اجرا نماید.", "برنامه تعمیر و نگهداری تجهیزات پیمانکار باید به صورت مستمر با هماهنگی نماینده کارفرما مورد بازنگری قرار گیرد.", "پیمانکار باید در برنامه های تعمیر و نگهداری تجهیزات خود، از وجود و چگون  "فعالیت های پیمانکار نباید موجب بروز آلودگی وتخریب زیست محیطی در منطقه شود.", "چنانچه بروز برخی آلودگی ها به لحاظ نوع مواد و فرایندهای تولیدی اجتناب ناپذیر باشد، پیمانکار موظف است اقدامات لازم را به منظور کاهش اثرات آلودگی انجام دهد.", "کنترل ومدیریت هرگونه آلاینده(آب، هوا و  خاک) در محدوده فعالیت پیمانکار بر عهده پیمانکار است. پیمانکار موظف است کلیه قوانین و استانداردهای ملی و محلی دراین خصوص را رعایت کند.", "پیمانکار باید در حوادثی که نشتی به همراه دارد و یک آلاینده (اسید، باز، هیدروکربن ها و موارد مشابه) به هوا، خاک، آب های سطحی و زیرزمینی راه می یابد، سریعاً نشتی را متوقف نماید. همچنین بایستی منطقه آلوده را پاکسازی کند و نماینده کارفرما را بلافاصله مطلع نماید.", "تمام هزینه های جمع آوری و دفع مواد آلوده و پاکسازی منطقه آلوده با خاک و مواد تمیز کننده و جریمه های قانونی احتمالی بر عهده پیمانکار خواهد بود.", "تخلیه هر گونه فاضلاب صنعتی و بهداشتی تصفیه شده به محیط ممنوع بوده و محل و روش دفع فاضلاب ها باید با نظارت کامل نماینده کارفرما باشد.", "پیمانکار باید حداکثر تلاش خود را برای کاهش تولید زائدات ناشی از سوخت و ساز فعالیت های بهره برداری صرف نماید. پیمانکارانی که با زائدات خطرناک یا زائدات با حجم زیاد سروکار دارند به منظور اطمینان از به کاربری روش های دفع مناسب باید کاملاً با نماینده کارفرما هماهنگ بوده و برنامه خود را به تصویب نماینده کارفرما برسانند.", "زائدات خطرناک تولید شده توسط پیمانکار نباید همراه سایر زائدات دفع شود. پیمانکار باید روش مناسب دفع این مواد را تهیه و به تایید نماینده کارفرما برساند. همچنین هزینه دفع زائدات خطرناک بر عهده پیمانکار است.", "هر گونه دخل و تصرف در زمین های به غیر از محل های مشخص شده در نقشه های اجرایی بدون مجوز نمایندة کارفرما ممنوع است.", "پیمانکار موظف به بازسازی مناطق تخریب شده ناشی از فعالیت خود بوده وبرگرداندن محیط تخریبی به وضعیت اولیه تا حد امکان میباشد و باید رضایت ذینفعان و نماینده کارفرما را در این خصوص کسب نماید.", "پیمانکار ملزم به اجرای قانون مدیریت پسماند و دستورالعمل اجرایی آن در طول انجام پیمان می باشد و هزینه مترتب از اجرای ناقص یا عدم اجرای آن متوجه پیمانکار می باشد.", "پیمانکار باید از بدو شروع به کار براساس گزارش ارزیابی زیست محیطی پروژه و همچنین گزارش بازرسین معتمد، اقدامات لازم را جهت کاهش اثرات ناشی از اجرای پروژه بر محیط زیست منطقه به عمل آورد.", "پیمانکار باید حسب مورد و نوع کار مطابق گزارش ارزیابی زیست محیطی تهیه شده و صورت جلسه مجوز زیست محیطی صادره از سازمان حفاظت محیط زیست نسبت به اقدامات لازم جهت کاهش اثرات ناشی از اجرای پروژه بر محیط زیست منطقه مطابق گزارش ارزیابی زیست محیطی اقدام نماید.", "در پروژه هایی که نیاز به ارزیابی زیست محیطی دارند پیمانکار موظف است قبل از شروع عملیات اجرایی نسبت به عقد قرارداد با یکی از بازرسین معتمد سازمان حفاظت محیط زیست و بر اساس شرح خدمات ارائه شده توسط این سازمان اقدام و کلیه فعالیت های اجرایی پروژه را از بدو شروع تحت پایش بازرسین معتمد محیط زیست قرار دهد. آشنایی با نقشه و موقعیت سایت و اینکه در زمان وقوع ریزش و نشتی چه باید کرد از وظایف ومسئولیت های پیمانکار است.", "در صورت کشف آثار تاریخی و باستانی در حین عملیات اجرایی، پیمانکار موظف است آثار تاریخی کشف شده را توسط حصار مناسب محصور و محافظت نمایند. پیمانکاران حق تعرض به این آثار را ندارد و اگر ناخواسته یک اثر تاریخی، تخریب شد و یا پیمانکار حدس می زند اثر جدیدی را کشف کرده است، باید کار را بلادرنگ متوقف کرده و موضوع را به نماینده کارفرم اطلاع دهد.", "چنانچه فعالیت اجرایی موضوع پیمان در مجاورت اماکن عمومی، مناطق مسکونی شهرها یا روستاها انجام می شود پیمانکار موظف است با رعایت کامل مقررات HSE ضمن پیشگیری از بروز هرگونه حادثه، تمهیدات لازم را به منظور مواجهه با حوادث احتمالی در طرح اضطراری خود مورد توجه قرار دهند. این طرح باید حاوی راهنمایی هایی برای تخلیه افراد غیر مسئول و نیز امداد و نجات عمومی باشد.", "کنترل ذرات و گرد و غبار ناشی از فعالیت پیمانکار برعهده وی می باشد. در مکان هایی که به علت خاکی بودن محیط کار پتانسیل ایجاد گرد و غبار وجود دارد باید برنامه آب پاشی مرتب با هماهنگی کامل نماینده کارفرما صورت گیرد.", "پیمانکار باید در طرح مدیریت زیست محیطی خود، برای جمع آوری فاضلاب های بهداشتی و صنعتی خود برنامه مشخصی داشته و به اجرا درآورد.", "پیمانکاران باید با مدیریت مناسب مواد شیمیایی و هیدروکربن ها، از آلودگی خاک، آب های سطحی و زیرزمینی و هوا پیشگیری نماید.", "۴-۷- قطع همکاری و پایان پیمان", "کارفرما عملکردهای پیمانکاران مشغول به کار را مورد بررسی قرار می دهد و در صورت عدم رعایت مقررات و دستورالعمل های HSE عملیات اجرایی را فوراً تا رفع تخلف متوقف می نماید.", "چنانچه قطع همکاری به علت لحاظ نشدن الزامات HSE (مواردی نظیر آلودگی های شدید زیست محیطی، آمار بالای حوادث و….) صورت پذیرد با پیمانکار مطابق قوانین در مورد همکاری های بعدی عمل می گردد.", "کلیه مواد شیمیایی مصرف نشده یا سایر مواد باقیمانده از فعالیت پیمانکار، پس از پایان عملیات اجرایی پیمان، باید از سایت جمع آوری و به نحو مطلوب ساماندهی یا دفع شود. کارفرما تحت هیچ شرایطی تعهدی درخصوص دفع مواد شیمیایی مازاد پیمانکار نخواهد داشت.", "پیمانکار موظف است گزارش عملکرد HSE خود (از جمله آمار بیماری های شغلی،حوادث،خسارت ها ، آسیب های فردی و زیست محیطی) را به اطلاع نماینده کارفرما برساند.", "واحدHSE  کارفرما در مدت زمان پیمان اطلاعات عملکرد HSE  پیمانکار را در قالب “چک لیست ارزیابی عملکردHSE پیمانکاران” در انتهای پروژه تکمیل می نماید. این اطلاعات به عنوان معیار ارزیابی نهایی عملکرد HSE پیمانکار مورد تجزیه و تحلیل قرار می گیرد. این ارزیابی متناسباً در مراحل بعدی منجمله در قرار دادهای آتی مد نظر قرار خواهد گرفت.", "کلیه پیمانکاران جهت اخذ مجوز شروع کار از طرف واحدهای مرتبط به واحد ایمنی معرفی می شوند .", "واحد ایمنی آموزش اهداف ایمنی  ، بهداشتی و زیست محیطی (HSE)  شرکت را به پیمانکاران ارائه خواهد داد.", "واحد ایمنی در خصوص فعالیت مورد نظر پیمانکار آموزشهای ایمنی مورد نیاز را به پیمانکاران ارائه خواهد داد .", "سایر دستورالعملهای کاری مورد نیاز پیمانکاران وضوابط اداری شرکت توسط واحد مرتبط به پیمانکاران ارائه خواهد شد .", "رعایت موارد ایمنی  ، بهداشتی و زیست محیطی (HSE)  زیر از طرف پیمانکاران الزامی است :", "کلیه پیمانکاران موظف هستند لباس کار و وسایل حفاظت فردی مورد نیاز نیروهای خود را تهیه نموده و در اختیار آنان قرار دهد.", "وسایل حفاظت فردی خریداری شده توسط پیمانکاران باید قبل از ورود به کارگاه مورد بازرسی مسئول ایمنی کارگاه قرارگرفته و پس از اخذ تاییدیه کتبی ، مورد استفاده قرار گیرد.", "پیمانکار موظف است اصول و الزامات سیستم مدیریت بهداشت شغلی و ایمنی (ISO 45001) و سیستم مدیریت مـحیط زیست (ISO 14001)
